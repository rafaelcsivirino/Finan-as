<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCS Finance</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c0d12">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RCS Finance">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7480;--bd:#e3e6ea;--pri:#0f766e;--red:#c2410c;--grn:#15803d;--warn:#fef3c7;--warnt:#78350f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111418;--card:#1b2026;--tx:#e8ebee;--mut:#98a2ae;--bd:#2c333b;--pri:#2dd4bf;--red:#fb923c;--grn:#4ade80;--warn:#3b2f0a;--warnt:#fde68a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111418;--card:#1b2026;--tx:#e8ebee;--mut:#98a2ae;--bd:#2c333b;--pri:#2dd4bf;--red:#fb923c;--grn:#4ade80;--warn:#3b2f0a;--warnt:#fde68a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.alert{background:var(--warn);color:var(--warnt);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{font-size:12px;color:var(--mut)}.v{font-weight:700;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--pri)}
input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
button{background:var(--pri);color:#fff;border:0;font-weight:600;cursor:pointer}
button.s{width:auto;padding:6px 10px;font-size:13px;background:transparent;color:var(--mut);border:1px solid var(--bd)}
.f{display:grid;gap:8px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;color:var(--mut);border-radius:0;padding:12px 4px;font-size:13px}
nav button.on{color:var(--pri)}
.bar i.w{background:#d97706}.bar i.r{background:var(--red)}
.red{color:var(--red)}.grn{color:var(--grn)}.mut{color:var(--mut);font-size:13px}
.brand{background:#0c0d12;border-radius:12px;margin:14px 14px 0;display:flex;flex-direction:column;align-items:center;padding:6px}.brand img{display:block;width:100%;max-width:300px;height:auto}
@media(min-width:680px){.brand{max-width:612px;margin:14px auto 0}}
.tools{align-self:flex-end;display:flex;gap:6px;position:relative;padding:2px 2px 4px}.tools>button{width:32px;height:32px;padding:0;font-size:16px;border-radius:50%;background:rgba(255,255,255,.14);border:0;color:#fff}
.menu{position:absolute;top:38px;right:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px;display:grid;gap:4px;min-width:170px;z-index:5}.menu[hidden]{display:none}.menu button{width:auto;background:transparent;color:var(--tx);font-size:14px;padding:8px 10px;text-align:left;font-weight:500}
.sec{padding:12px 0 4px;margin-top:10px;border-top:1px solid var(--bd)}
details.card>summary{list-style:none}details.card>summary::-webkit-details-marker{display:none}details.card>summary::after{content:'▾';float:right;color:var(--mut)}details.card[open]>summary::after{content:'▴'}
</style>
</head>
<body>
<div class="brand">
<div class="tools" id="tools" style="display:none"><button title="Baixar planilha do mês" aria-label="Baixar planilha do mês" onclick="exportXlsx()">📊</button><button title="Backup" aria-label="Backup" onclick="toggleBk()">💾</button><div class="menu" id="bkmenu" hidden><button onclick="exportar();toggleBk()">Exportar backup</button><button onclick="imp.click();toggleBk()">Importar backup</button></div></div>
<img src="logo.png" alt="RCS Finance">
<input id="imp" type="file" accept=".json" hidden onchange="importar(this.files[0]);this.value=''">
</div>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dias=s=>Math.round((parse(s)-today())/864e5);
const uid=()=>Math.random().toString(36).slice(2,9);
const CATS=['Moradia','Mercado','Transporte','Lazer','Saúde','Contas','Educação','Outros'];
let S={tx:[],bills:[],goals:[],cfg:{payday:7}},tab='resumo',ref=null,loaded=false,note='';
let KEY='financas-v1';
let vm=iso(today()).slice(0,7),ed=null,PR=[],cur=null,gate=null,hiddenAt=0;
function savePR(){try{localStorage.setItem('rcs-profiles',JSON.stringify(PR))}catch(e){}}
let sessChk=false,sb=null,user=null,syncMsg='',syncing=false,again=false,pt=null;
try{const c=window.RCS_CFG||{};if(c.url&&c.key&&window.supabase)sb=window.supabase.createClient(c.url,c.key)}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const busy=()=>{const t=document.activeElement&&document.activeElement.tagName;return t==='INPUT'||t==='SELECT'};
const softRender=()=>{if(!gate&&!busy())render()};
async function ensureUser(){if(!sb)return null;try{const {data}=await sb.auth.getSession();user=data.session?data.session.user:null}catch(e){}return user}
async function getRemote(){const {data,error}=await sb.from('finance_data').select('data').eq('user_id',user.id).maybeSingle();if(error)throw error;return data&&data.data&&data.data.ts?data.data:null}
async function push(){const {error}=await sb.from('finance_data').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});if(error)throw error}
async function syncNow(manual){
  if(!sb||!cur||!cur.acct)return;
  if(syncing){again=true;return}
  syncing=true;
  try{
    await ensureUser();sessChk=true;
    if(!user||(cur.email&&user.email!==cur.email)){syncMsg='Entre na conta para sincronizar.';return}
    const r=await getRemote(),t=S.ts||0;
    if(!r||t>r.ts)await push();
    else if(t<r.ts){S=Object.assign(DEF(),r);persist()}
    syncMsg='Sincronizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){syncMsg='Sem conexão ou erro ao sincronizar. Seus dados continuam salvos neste aparelho.'}
  finally{syncing=false;if(again){again=false;syncNow()}else softRender()}
}
function schedPush(){if(!sb||!cur||!cur.acct)return;clearTimeout(pt);pt=setTimeout(()=>{pt=null;syncNow()},800)}
async function doAuth(kind){
  const em=(document.getElementById('em').value||'').trim(),pw=document.getElementById('pw').value||'';
  if(!sb)return null;
  if(!em||pw.length<6){alert('Informe e-mail e senha (mínimo 6 caracteres).');return null}
  try{
    const r=kind==='up'?await sb.auth.signUp({email:em,password:pw}):await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){alert(r.error.message);return null}
    if(!r.data.session){alert('Conta criada. Confirme o e-mail que enviamos e depois toque em Entrar.');return null}
    user=r.data.session.user;return user;
  }catch(e){alert('Não foi possível conectar. Verifique a internet.');return null}
}
async function accIn(kind){
  if(!await doAuth(kind))return;
  try{
    const r=await getRemote(),has=S.tx.length||S.bills.length||S.goals.length||(S.rec||[]).length;
    cur.acct=true;cur.email=user.email;savePR();
    if(r&&has){if(confirm('Esta conta já tem dados na nuvem.\n\nOK = usar os dados da nuvem (substitui os deste perfil)\nCancelar = enviar os dados deste perfil (substitui os da nuvem)')){S=Object.assign(DEF(),r)}else S.ts=Date.now()}
    else if(r)S=Object.assign(DEF(),r);
    else S.ts=Date.now();
    persist();syncMsg='';await syncNow(true);
  }catch(e){syncMsg='Erro ao vincular a conta.'}
  render();
}
async function gateIn(kind){
  if(!await doAuth(kind))return;
  try{
    let p=PR.find(x=>x.email===user.email);
    if(!p){const r=await getRemote(),id='p'+uid();p={id,name:user.email.split('@')[0],key:'rcs-'+id,pin:null,acct:true,email:user.email};PR.push(p);savePR();if(r)try{localStorage.setItem(p.key,JSON.stringify(r))}catch(e){}}
    openProfile(p);
  }catch(e){alert('Não foi possível carregar os dados da conta.')}
}
async function accOut(){try{await sb.auth.signOut()}catch(e){}user=null;cur.acct=false;cur.email=null;savePR();syncMsg='';render()}
function ntfyOn(){S.cfg.ntfy='rcs-'+Array.from(crypto.getRandomValues(new Uint8Array(20)),b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('');save()}
function ntfyOff(){delete S.cfg.ntfy;save()}
function ntfyCopy(){try{navigator.clipboard.writeText(S.cfg.ntfy);alert('Tópico copiado.')}catch(e){alert('Copie manualmente o tópico mostrado na tela.')}}
async function ntfyTest(){try{const r=await fetch('https://ntfy.sh/'+S.cfg.ntfy,{method:'POST',body:'✅ Teste do RCS Finance: as notificações estão funcionando!'});alert(r.ok?'Teste enviado. Veja se chegou no app ntfy.':'Não foi possível enviar o teste.')}catch(e){alert('Sem conexão para enviar o teste.')}}
function ntfyCard(){
  const t=S.cfg&&S.cfg.ntfy;
  if(!t)return `<div class="sec"><h2>Notificações</h2><div class="mut" style="margin-bottom:8px">Receba avisos no celular, mesmo com o app fechado: dia de investir e boletos (hoje, amanhã e atrasados).</div><button onclick="ntfyOn()">Ativar notificações</button></div>`;
  return `<div class="sec"><h2>Notificações</h2><div class="mut">1) Instale o app <b>ntfy</b> (Play Store ou App Store).<br>2) Abra, toque em <b>+</b> e digite este tópico:</div><div style="margin:8px 0;padding:10px;border-radius:8px;border:1px dashed var(--bd);word-break:break-all;user-select:all"><b>${E(t)}</b></div><div class="mut" style="margin-bottom:8px">Trate o tópico como uma senha: não compartilhe. O aviso sai todo dia às 8h${cur&&cur.acct?'':' — <b>só funciona com a sincronização ligada</b> (crie a conta no card abaixo)'}.</div><div class="f2"><button onclick="ntfyTest()">Enviar teste</button><button class="s" style="width:100%" onclick="ntfyCopy()">Copiar tópico</button></div><button class="s" style="width:100%;margin-top:8px" onclick="ntfyOff()">Desativar</button></div>`;
}
const getCats=()=>(S.cats&&S.cats.length?S.cats:CATS);
let catOpen=false;
function collectLim(){const L={};getCats().forEach((c,i)=>{const el=document.getElementById('lm'+i),v=el?parseFloat(el.value):(S.limits||{})[c];if(v>0)L[c]=v});S.limits=L}
function saveLim(){collectLim();save()}
function addCat(){const n=(document.getElementById('nc').value||'').trim();if(!n)return;if(getCats().some(c=>c.toLowerCase()===n.toLowerCase())){alert('Essa categoria já existe.');return}collectLim();S.cats=[...getCats(),n];save()}
function delCat(i){const c=getCats()[i];if(getCats().length<=1){alert('Mantenha pelo menos uma categoria.');return}if(!confirm('Remover a categoria "'+c+'"? Lançamentos antigos continuam com ela.'))return;collectLim();delete S.limits[c];S.cats=getCats().filter((_,j)=>j!==i);save()}
function catCard(){
  const lim=S.limits||{};
  return `<details class="card" ${catOpen?'open':''} ontoggle="catOpen=this.open"><summary style="cursor:pointer;font-weight:600">Categorias e limites</summary><div class="mut" style="margin:8px 0">Defina um limite mensal (opcional) e adicione ou remova categorias.</div><div class="f">${getCats().map((c,i)=>`<div style="display:grid;grid-template-columns:1fr 110px auto;gap:6px;align-items:center"><span>${E(c)}</span><input id="lm${i}" type="number" inputmode="decimal" placeholder="sem limite" value="${lim[c]||''}"><button class="s" onclick="delCat(${i})">✕</button></div>`).join('')}<button onclick="saveLim()">Salvar limites</button><div class="f2"><input id="nc" placeholder="Nova categoria"><button class="s" style="width:100%" onclick="addCat()">Adicionar</button></div></div></details>`;
}
const syncOk=()=>!!(user&&cur&&user.email===cur.email);
const needLogin=()=>!!(sb&&cur&&cur.acct&&sessChk&&!syncOk());
let cfgOpen=false;
function openCfg(){cfgOpen=true;render();const d=document.getElementById('cfg');if(d&&d.scrollIntoView)d.scrollIntoView()}
function cfgStatus(){
  const a=[];
  if(sb){a.push(!(cur&&cur.acct)?'☁️ sincronização desligada':!sessChk?'☁️ verificando…':!syncOk()?'⚠️ entre na conta':syncMsg.startsWith('Sincronizado')?'☁️ '+syncMsg.toLowerCase():syncMsg.startsWith('Sem')?'☁️ sem conexão':'☁️ conectado')}
  a.push(S.cfg&&S.cfg.ntfy?'🔔 avisos ativos':'🔔 avisos desligados');
  return a.join(' · ');
}
function cfgCard(){
  const lembrete=`<div class="sec"><h2>Lembrete de investimento</h2><div class="k">Dias do mês para guardar dinheiro (separe por vírgula)</div><div class="f2" style="margin-top:6px"><input id="pd" value="${daysList().join(', ')}"><button onclick="S.cfg.days=pd.value;save()">Salvar</button></div></div>`;
  const perfil=`<div class="sec"><h2>Perfil: ${E(cur?cur.name:'')}</h2><div class="f"><button class="s" style="width:100%" onclick="lock()">Trocar de perfil</button><button class="s" style="width:100%" onclick="delProfile()">Apagar este perfil</button></div></div>`;
  return `<details id="cfg" class="card" ${cfgOpen?'open':''} ontoggle="cfgOpen=this.open"><summary style="cursor:pointer"><b>Configurações</b><div class="mut" style="margin-top:2px">${cfgStatus()}</div></summary>${lembrete}${ntfyCard()}${syncCard()}${perfil}</details>`;
}
function syncCard(){
  if(!sb)return `<div class="sec"><h2>Sincronização</h2><div class="mut">Ainda não configurada neste site.</div></div>`;
  if(cur&&cur.acct){const ok=user&&user.email===cur.email;
    return `<div class="sec"><h2>Sincronização</h2><div class="mut">Conta: ${E(cur.email)}</div><div class="mut">${E(syncMsg)}</div>${ok?`<div class="f2" style="margin-top:8px"><button onclick="syncNow(true)">Sincronizar agora</button><button class="s" style="width:100%" onclick="accOut()">Sair da conta</button></div>`:`<div class="f" style="margin-top:8px"><input id="em" type="email" value="${E(cur.email)}"><input id="pw" type="password" placeholder="Senha"><button onclick="accIn('in')">Entrar</button></div>`}</div>`}
  return `<div class="sec"><h2>Sincronização</h2><div class="mut" style="margin-bottom:8px">Entre ou crie uma conta para ter os mesmos dados no celular e no PC.</div><div class="f"><input id="em" type="email" placeholder="E-mail"><input id="pw" type="password" placeholder="Senha (mín. 6 caracteres)"><div class="f2"><button onclick="accIn('in')">Entrar</button><button class="s" style="width:100%" onclick="accIn('up')">Criar conta</button></div></div></div>`;
}
function boot(){
  try{PR=JSON.parse(localStorage.getItem('rcs-profiles')||'[]')}catch(e){PR=[]}
  if(!PR.length&&localStorage.getItem('financas-v1')){PR=[{id:'p1',name:'Meu perfil',key:'financas-v1',pin:null}];savePR()}
  loaded=true;
  if(!PR.length){gate={m:'new'};render();return}
  let last=null;try{last=localStorage.getItem('rcs-last')}catch(e){}
  const p=PR.find(x=>x.id===last)||(PR.length===1?PR[0]:null);
  if(!p){gate={m:'pick'};render();return}
  openProfile(p);
}
function openProfile(p){sessChk=false;cur=p;KEY=p.key;gate=null;try{localStorage.setItem('rcs-last',p.id)}catch(e){}S=DEF();vm=iso(today()).slice(0,7);tab='resumo';ed=null;loadLocal();syncNow()}
const go=m=>{gate={m};render()};
function pickP(id){openProfile(PR.find(x=>x.id===id))}
async function newP(){const n=pn.value.trim();if(!n)return;const id='p'+uid(),p={id,name:n,key:'rcs-'+id};PR.push(p);savePR();openProfile(p)}
function lock(){gate={m:'pick'};render()}
function delProfile(p,ask){p=p||cur;if(!confirm(ask||'Apagar este perfil e todos os dados dele neste aparelho?'))return;
  try{localStorage.removeItem(p.key);localStorage.removeItem('rcs-last')}catch(e){}
  PR=PR.filter(x=>x.id!==p.id);savePR();cur=null;S=DEF();gate=PR.length?{m:'pick'}:{m:'new'};render()}
function gateHtml(){
  const g=gate;
  if(g.m==='login')return `<h1>Entrar na conta</h1><div class="card f"><input id="em" type="email" placeholder="E-mail"><input id="pw" type="password" placeholder="Senha"><div class="f2"><button onclick="gateIn('in')">Entrar</button><button class="s" style="width:100%" onclick="gateIn('up')">Criar conta</button></div><button class="s" style="width:100%" onclick="go('${PR.length?'pick':'new'}')">Voltar</button></div>`;
  if(g.m==='pick')return `<h1>Quem é você?</h1><div class="card f">${PR.map(p=>`<button onclick="pickP('${p.id}')">${E(p.name)}</button>`).join('')}<button class="s" style="width:100%" onclick="go('new')">＋ Novo perfil</button></div>`;
  if(g.m==='new')return `<h1>${PR.length?'Novo perfil':'Bem-vindo!'}</h1><div class="card f"><input id="pn" placeholder="Seu nome"><button onclick="newP()">Criar perfil</button>${sb?`<button class="s" style="width:100%" onclick="go('login')">Já tenho conta (entrar)</button>`:''}${PR.length?`<button class="s" style="width:100%" onclick="go('pick')">Voltar</button>`:''}</div>`;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();if(pt){clearTimeout(pt);pt=null;syncNow()}}else{syncNow()}});
window.addEventListener('online',()=>syncNow());
const tot=mk=>{const o={r:0,g:0,i:0};S.tx.forEach(t=>{if(monthKey(t.date)===mk)o[t.type==='receita'?'r':t.type==='gasto'?'g':'i']+=t.value});return o};
const addM=(mk,n)=>{const [y,m]=mk.split('-').map(Number);return iso(new Date(y,m-1+n,1)).slice(0,7)};
const mname=mk=>{const [y,m]=mk.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.','')};
function graficos(){
  const mks=[5,4,3,2,1,0].map(n=>addM(vm,-n)),T=mks.map(tot),mx=Math.max(1,...T.flatMap(o=>[o.r,o.g,o.i])),a0=T[5],a1=T[4];
  let h=`<h1>Gráficos</h1><div class="card"><div class="k">Mês base</div><input type="month" value="${vm}" onchange="vm=this.value||vm;render()"></div>`;
  const line=(n,a,b,upBad)=>{if(!b)return `<div class="row"><span>${n}</span><span class="mut">sem dados do mês anterior</span></div>`;const p=(a-b)/b*100,bad=upBad?p>0:p<0;return `<div class="row"><span>${n}: <b>${brl(a)}</b></span><b class="${p===0?'':bad?'red':'grn'}">${p>0?'+':''}${Math.round(p)}%</b></div>`};
  h+=`<div class="card"><h2>${mname(mks[5])} vs ${mname(mks[4])}</h2>${line('Gasto',a0.g,a1.g,true)}${line('Investido',a0.i,a1.i,false)}${line('Recebido',a0.r,a1.r,false)}${a0.r?`<div class="mut" style="margin-top:8px">Você investiu ${Math.round(a0.i/a0.r*100)}% da receita deste mês.</div>`:''}</div>`;
  const W=320,H=150,gw=W/6,bw=13;
  let svg=`<svg viewBox="0 0 ${W} ${H+22}" style="width:100%;height:auto">`;
  T.forEach((o,i)=>{[['r','--grn'],['g','--red'],['i','--pri']].forEach(([k,c],j)=>{const hh=o[k]/mx*H;svg+=`<rect x="${i*gw+(gw-3*bw-4)/2+j*(bw+2)}" y="${H-hh}" width="${bw}" height="${hh}" rx="2" style="fill:var(${c})"/>`});svg+=`<text x="${i*gw+gw/2}" y="${H+16}" text-anchor="middle" font-size="11" style="fill:var(--mut)">${mname(mks[i])}</text>`});
  svg+='</svg>';
  h+=`<div class="card"><h2>Últimos 6 meses</h2>${T.every(o=>!o.r&&!o.g&&!o.i)?'<div class="mut">Lance receitas, gastos e investimentos para ver o gráfico.</div>':svg+'<div class="mut"><span class="grn">■</span> Recebido &nbsp;<span class="red">■</span> Gasto &nbsp;<span style="color:var(--pri)">■</span> Investido</div>'}</div>`;
  return h;
}
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF=()=>({tx:[],bills:[],goals:[],cfg:{payday:7},rec:[],recGen:{},limits:{}});
function genRec(){
  let ch=false;const t=today();S.recGen=S.recGen||{};
  [0,1].forEach(k=>{const mk=iso(new Date(t.getFullYear(),t.getMonth()+k,1)).slice(0,7);
    (S.rec||[]).forEach(r=>{const key=r.id+':'+mk;if(S.recGen[key])return;S.recGen[key]=1;ch=true;
      const due=mk+'-'+String(r.day).padStart(2,'0');
      if(due<(r.created||'0000'))return;
      S.bills.push({id:uid(),name:r.name,value:r.value,due,paid:false,rec:r.id})})});
  return ch;
}
const catSpend=v=>{const by={};v.m.filter(t=>t.type==='gasto').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.value);return by};
function limAlerts(v){
  if(vm!==iso(today()).slice(0,7))return '';
  const by=catSpend(v);let h='';
  Object.entries(S.limits||{}).forEach(([c,l])=>{if(!(l>0))return;const x=by[c]||0,p=x/l*100;
    if(p>=100)h+=`<div class="alert">🚨 ${c}: você passou do limite (${brl(x)} de ${brl(l)}).</div>`;
    else if(p>=80)h+=`<div class="alert">⚠️ ${c}: você já usou ${Math.round(p)}% do limite (${brl(x)} de ${brl(l)}).</div>`});
  return h;
}
const daysList=()=>String(S.cfg.days||'7,20').split(/[ ,;]+/).map(Number).filter(n=>n>=1&&n<=28);

function init(){boot()}
function loadLocal(){
  loaded=true;note=(cur&&cur.acct)?'':'Salvando só neste aparelho (sem sincronização).';
  try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(DEF(),JSON.parse(r))}catch(e){}
  if(genRec()){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  render();
}
function save(){
  S.ts=Date.now();render();persist();schedPush();
}
const monthKey=s=>s.slice(0,7);
function nextPayday(){
  const d=today();let best=null;
  daysList().forEach(p=>{let n=new Date(d.getFullYear(),d.getMonth(),p);if(n<d)n=new Date(d.getFullYear(),d.getMonth()+1,p);if(!best||n<best)best=n});
  return best||new Date(d.getFullYear(),d.getMonth()+1,7);
}
function pmt(g){
  const n=Math.max(1,Math.ceil((parse(g.date)-today())/(864e5*30.4))),r=(g.rate||0)/100,saved=g.saved||0;
  if(r>0){const f=Math.pow(1+r,n);return Math.max(0,(g.target-saved*f)*r/(f-1))}
  return Math.max(0,(g.target-saved)/n);
}
function views(){
  const mk=vm,m=S.tx.filter(t=>monthKey(t.date)===mk);
  const sum=ty=>m.filter(t=>t.type===ty).reduce((a,t)=>a+t.value,0);
  return {mk,rec:sum('receita'),gas:sum('gasto'),inv:sum('investimento'),m};
}
function resumo(){
  const v=views(),np=nextPayday(),dp=Math.round((np-today())/864e5);
  let h=`<h1>Resumo</h1><div class="card"><div class="k">Mês exibido</div><input type="month" value="${vm}" onchange="vm=this.value||vm;render()"></div>`;
  h+=needLogin()?`<div class="alert" onclick="openCfg()" style="cursor:pointer">⚠️ Você saiu da conta: entre novamente para voltar a sincronizar (toque aqui).</div>`:'';
  h+=`<div class="alert">${dp===0?'💰 Hoje é dia '+np.getDate()+': hora de guardar dinheiro para investir!':'📅 Próximo dia de investir ('+np.toLocaleDateString('pt-BR')+'): faltam '+dp+' dia(s).'}</div>`;
  const open=S.bills.filter(b=>!b.paid).sort((a,b)=>a.due.localeCompare(b.due));
  open.filter(b=>dias(b.due)<=3).forEach(b=>{const d=dias(b.due);h+=`<div class="alert">${d<0?'⚠️ Atrasado':'🔔'} ${b.name} (${brl(b.value)}) ${d<0?'venceu há '+(-d)+' dia(s)':d===0?'vence hoje':'vence em '+d+' dia(s)'}</div>`});
  S.goals.forEach(g=>{h+=`<div class="alert">🎯 ${g.name}: invista ${brl(pmt(g))} neste mês.</div>`});
  h+=limAlerts(v);
  h+=`<div class="card grid"><div><div class="k">Recebido</div><div class="v grn">${brl(v.rec)}</div></div><div><div class="k">Gasto</div><div class="v red">${brl(v.gas)}</div></div><div><div class="k">Investido</div><div class="v">${brl(v.inv)}</div></div></div>`;
  const by=catSpend(v),lim=S.limits||{};
  const cats=[...new Set([...Object.keys(by),...Object.keys(lim).filter(c=>lim[c]>0)])].sort((a,b)=>(by[b]||0)-(by[a]||0));
  const mx=Math.max(1,...cats.map(c=>by[c]||0));
  h+='<div class="card"><h2>Onde você mais gastou</h2>';
  h+=cats.length?cats.map(c=>{const x=by[c]||0,l=lim[c]>0?lim[c]:0,p=l?x/l*100:0,cl=!l?'':p>=100?'r':p>=80?'w':'';
    return `<div style="margin-bottom:10px"><div class="row" style="border:0;padding:0"><span>${c}</span><b>${brl(x)}${l?' <span class="mut">/ '+brl(l)+'</span>':''}</b></div><div class="bar"><i class="${cl}" style="width:${l?Math.min(100,p):x/mx*100}%"></i></div>${l?`<div class="mut">${Math.round(p)}% do limite</div>`:''}</div>`}).join(''):'<div class="mut">Sem gastos lançados neste mês.</div>';
  h+='</div>';
  h+=catCard();
  h+=cfgCard();
  return h;
}
function lancar(){
  const e=ed?S.tx.find(t=>t.id===ed):null,sel=(v,x)=>v===x?' selected':'';
  let h=`<h1>${e?'Editar lançamento':'Lançar'}</h1><div class="card f"><select id="ty">${[['gasto','Gasto'],['investimento','Investimento'],['receita','Receita']].map(([k,n])=>`<option value="${k}"${sel(e&&e.type,k)}>${n}</option>`).join('')}</select>
  <div class="f2"><input id="vl" type="number" inputmode="decimal" step="0.01" placeholder="Valor (R$)" value="${e?e.value:''}"><input id="dt" type="date" value="${e?e.date:iso(today())}"></div>
  <select id="ct">${[...new Set([...getCats(),...(e&&e.cat?[e.cat]:[])])].map(c=>`<option${sel(e&&e.cat,c)}>${c}</option>`).join('')}</select><input id="ds" placeholder="Descrição (opcional)" value="${e?E(e.desc||''):''}">
  <button onclick="addTx()">${e?'Salvar alteração':'Adicionar'}</button>${e?'<button class="s" style="width:100%" onclick="cancelEd()">Cancelar edição</button>':''}</div><div class="card"><h2>Últimos lançamentos</h2>`;
  const l=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,25);
  h+=l.length?l.map(t=>`<div class="row"><div><div>${E(t.desc||t.cat)}</div><div class="mut">${parse(t.date).toLocaleDateString('pt-BR')} · ${t.type==='gasto'?t.cat:t.type}</div></div><div style="text-align:right"><b class="${t.type==='gasto'?'red':'grn'}">${t.type==='gasto'?'−':'+'}${brl(t.value)}</b><br><button class="s" onclick="editTx('${t.id}')">✎</button> <button class="s" onclick="delTx('${t.id}')">✕</button></div></div>`).join(''):'<div class="mut">Nada lançado ainda.</div>';
  return h+'</div>';
}
function addTx(){const v=parseFloat(vl.value);if(!(v>0))return;const o={type:ty.value,value:v,date:dt.value||iso(today()),cat:ct.value,desc:ds.value.trim()};
  if(ed){const t=S.tx.find(x=>x.id===ed);if(t)Object.assign(t,o);ed=null}else S.tx.push(Object.assign({id:uid()},o));save()}
function editTx(i){ed=i;tab='lancar';render();scrollTo(0,0)}
function cancelEd(){ed=null;render()}
function delTx(i){S.tx=S.tx.filter(t=>t.id!==i);save()}
function boletos(){
  let h=`<h1>Boletos</h1><div class="card f"><input id="bn" placeholder="Nome (ex.: Internet)"><div class="f2"><input id="bv" type="number" inputmode="decimal" step="0.01" placeholder="Valor (R$)"><input id="bd" type="date"></div><button onclick="addBill()">Cadastrar boleto</button></div><div class="card">`;
  const l=[...S.bills].sort((a,b)=>(a.paid-b.paid)||a.due.localeCompare(b.due));
  h+=l.length?l.map(b=>{const d=dias(b.due);return `<div class="row"><div><div>${b.paid?'✅ ':''}${b.rec?'🔁 ':''}${E(b.name)} · <b>${brl(b.value)}</b></div><div class="mut ${!b.paid&&d<0?'red':''}">${parse(b.due).toLocaleDateString('pt-BR')}${b.paid?' · pago':d<0?' · atrasado':d===0?' · hoje':' · em '+d+' dia(s)'}</div></div><div>${b.paid?'':`<button class="s" onclick="payBill('${b.id}')">Paguei</button> `}<button class="s" onclick="delBill('${b.id}')">✕</button></div></div>`}).join(''):'<div class="mut">Nenhum boleto cadastrado.</div>';
  h+='</div>';
  h+=`<div class="card"><h2>Contas fixas (todo mês)</h2><div class="mut" style="margin-bottom:8px">O boleto é criado sozinho todo mês.</div><div class="f"><input id="rn" placeholder="Nome (ex.: Aluguel)"><div class="f2"><input id="rv" type="number" inputmode="decimal" step="0.01" placeholder="Valor (R$)"><input id="rd" type="number" min="1" max="28" placeholder="Dia do vencimento"></div><button onclick="addRec()">Cadastrar conta fixa</button></div>`;
  h+=(S.rec||[]).map(r=>`<div class="row"><div>🔁 ${E(r.name)} · <b>${brl(r.value)}</b><div class="mut">todo dia ${r.day}</div></div><button class="s" onclick="delRec('${r.id}')">✕</button></div>`).join('')+'</div>';
  return h;
}
function addRec(){const v=parseFloat(rv.value),d=Math.min(28,Math.max(1,parseInt(rd.value)));if(!rn.value.trim()||!(v>0)||!d)return;S.rec=S.rec||[];S.rec.push({id:uid(),name:rn.value.trim(),value:v,day:d,created:iso(today())});genRec();save()}
function delRec(i){S.rec=S.rec.filter(r=>r.id!==i);S.bills=S.bills.filter(b=>!(b.rec===i&&!b.paid));save()}
function addBill(){const v=parseFloat(bv.value);if(!bn.value.trim()||!(v>0)||!bd.value)return;S.bills.push({id:uid(),name:bn.value.trim(),value:v,due:bd.value,paid:false});save()}
function payBill(i){const b=S.bills.find(x=>x.id===i);b.paid=true;S.tx.push({id:uid(),type:'gasto',value:b.value,date:iso(today()),cat:'Contas',desc:b.name});save()}
function delBill(i){S.bills=S.bills.filter(b=>b.id!==i);save()}
function metas(){
  let h=`<h1>Metas</h1><div class="card f"><input id="gn" placeholder="Meta (ex.: Viagem)"><div class="f2"><input id="gt" type="number" inputmode="decimal" placeholder="Valor alvo (R$)"><input id="gd" type="date"></div><div class="f2"><input id="gs" type="number" inputmode="decimal" placeholder="Já tenho (R$)"><input id="gr" type="number" step="0.01" placeholder="Rendimento % ao mês"></div><button onclick="addGoal()">Criar meta</button></div>`;
  h+=S.goals.map(g=>`<div class="card"><div class="row" style="border:0;padding:0"><h2>${g.name}</h2><button class="s" onclick="delGoal('${g.id}')">✕</button></div><div class="mut">${brl(g.target)} até ${parse(g.date).toLocaleDateString('pt-BR')}</div><div style="margin-top:6px">Invista por mês: <b>${brl(pmt(g))}</b></div></div>`).join('');
  return h;
}
function addGoal(){const t=parseFloat(gt.value);if(!gn.value.trim()||!(t>0)||!gd.value)return;S.goals.push({id:uid(),name:gn.value.trim(),target:t,date:gd.value,saved:parseFloat(gs.value)||0,rate:parseFloat(gr.value)||0});save()}
function delGoal(i){S.goals=S.goals.filter(g=>g.id!==i);save()}
function render(){
  const tl=document.getElementById('tools');if(tl&&tl.style)tl.style.display=gate?'none':'flex';
  if(gate){document.getElementById('app').innerHTML=gateHtml();document.getElementById('nav').innerHTML='';return}
  const a=document.getElementById('app');
  const act=document.activeElement&&document.activeElement.id;
  if(!loaded){a.innerHTML='<div class="mut" style="padding:30px;text-align:center">Carregando…</div>'}
  else a.innerHTML=({resumo,lancar,boletos,metas,graficos})[tab]()+(note?`<div class="mut">${note}</div>`:'');
  document.getElementById('nav').innerHTML=[['resumo','📊','Resumo'],['lancar','➕','Lançar'],['boletos','🧾','Boletos'],['metas','🎯','Metas'],['graficos','📈','Gráficos']].map(([k,i,n])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)">${i}<br>${n}</button>`).join('');
}
function toggleBk(){const m=document.getElementById('bkmenu');m.hidden=!m.hidden}
document.addEventListener('click',e=>{const m=document.getElementById('bkmenu');if(m&&!m.hidden&&e.target.closest&&!e.target.closest('#tools'))m.hidden=true});
function exportar(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='financas-'+iso(today())+'.json';a.click()}
function importar(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm('Isso substitui os dados deste aparelho. Continuar?'))return;S=Object.assign(DEF(),d);genRec();save()}catch(e){alert('Arquivo inválido.')}};r.readAsText(f)}
function exportXlsx(){
  if(typeof XLSX==='undefined'){alert('A biblioteca da planilha não carregou. Abra o app com internet e tente de novo.');return}
  const v=views(),mk=vm,money='R$ #,##0.00';
  const by={};v.m.filter(t=>t.type==='gasto').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.value);
  const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=ent.length?ent[0][1]:1;
  const A=[['Resumo de '+mk],[],['Recebido',v.rec],['Gasto',v.gas],['Investido',v.inv],['Sobra (recebido - gasto - investido)',v.rec-v.gas-v.inv],['% da receita investida',v.rec?v.inv/v.rec:0],[],['Categoria','Gasto','% do gasto','Gráfico']];
  ent.forEach(([c,x])=>A.push([c,x,v.gas?x/v.gas:0,'█'.repeat(Math.max(1,Math.round(x/mx*20)))]));
  const w1=XLSX.utils.aoa_to_sheet(A);
  ['B3','B4','B5','B6'].forEach(a=>w1[a].z=money);w1.B7.z='0.0%';
  ent.forEach((_,i)=>{w1['B'+(10+i)].z=money;w1['C'+(10+i)].z='0.0%'});
  w1['!cols']=[{wch:38},{wch:16},{wch:12},{wch:24}];
  const L=[['Data','Tipo','Categoria','Descrição','Valor']];
  [...v.m].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>L.push([parse(t.date).toLocaleDateString('pt-BR'),t.type,t.type==='gasto'?t.cat:'',t.desc||'',t.value]));
  const w2=XLSX.utils.aoa_to_sheet(L);for(let i=2;i<=L.length;i++)w2['E'+i].z=money;
  w2['!cols']=[{wch:12},{wch:14},{wch:14},{wch:28},{wch:14}];
  const B=[['Boleto','Vencimento','Valor','Situação']];
  S.bills.filter(b=>monthKey(b.due)===mk).sort((a,b)=>a.due.localeCompare(b.due)).forEach(b=>B.push([b.name,parse(b.due).toLocaleDateString('pt-BR'),b.value,b.paid?'Pago':'Em aberto']));
  const w3=XLSX.utils.aoa_to_sheet(B);for(let i=2;i<=B.length;i++)w3['C'+i].z=money;w3['!cols']=[{wch:24},{wch:12},{wch:14},{wch:12}];
  const H={};S.tx.forEach(t=>{const k=monthKey(t.date);H[k]=H[k]||{r:0,g:0,i:0};H[k][t.type==='receita'?'r':t.type==='gasto'?'g':'i']+=t.value});
  const R=[['Mês','Recebido','Gasto','Investido']];Object.keys(H).sort().forEach(k=>R.push([k,H[k].r,H[k].g,H[k].i]));
  const w4=XLSX.utils.aoa_to_sheet(R);for(let i=2;i<=R.length;i++)['B','C','D'].forEach(c=>w4[c+i].z=money);w4['!cols']=[{wch:10},{wch:14},{wch:14},{wch:14}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,w1,'Resumo');XLSX.utils.book_append_sheet(wb,w2,'Lançamentos');XLSX.utils.book_append_sheet(wb,w3,'Boletos');XLSX.utils.book_append_sheet(wb,w4,'Histórico');
  XLSX.writeFile(wb,'financas-'+mk+'.xlsx');
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script>
