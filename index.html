<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCS Finance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c0d12">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RCS Finance">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7480;--bd:#e3e6ea;--pri:#0f766e;--red:#c2410c;--grn:#15803d;--warn:#fef3c7;--warnt:#78350f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111418;--card:#1b2026;--tx:#e8ebee;--mut:#98a2ae;--bd:#2c333b;--pri:#2dd4bf;--red:#fb923c;--grn:#4ade80;--warn:#3b2f0a;--warnt:#fde68a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111418;--card:#1b2026;--tx:#e8ebee;--mut:#98a2ae;--bd:#2c333b;--pri:#2dd4bf;--red:#fb923c;--grn:#4ade80;--warn:#3b2f0a;--warnt:#fde68a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.alert{background:var(--warn);color:var(--warnt);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{font-size:12px;color:var(--mut)}.v{font-weight:700;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--pri)}
input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
button{background:var(--pri);color:#fff;border:0;font-weight:600;cursor:pointer}
button.s{width:auto;padding:6px 10px;font-size:13px;background:transparent;color:var(--mut);border:1px solid var(--bd)}
.f{display:grid;gap:8px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;color:var(--mut);border-radius:0;padding:12px 4px;font-size:13px}
nav button.on{color:var(--pri)}
.bar i.w{background:#d97706}.bar i.r{background:var(--red)}
.red{color:var(--red)}.grn{color:var(--grn)}.mut{color:var(--mut);font-size:13px}
.brand{background:#0c0d12;border-radius:12px;margin:14px 14px 0;display:flex;justify-content:center;padding:6px}.brand img{display:block;width:100%;max-width:300px;height:auto}
@media(min-width:680px){.brand{max-width:612px;margin:14px auto 0}}
</style>
</head>
<body>
<div class="brand"><img src="logo.png" alt="RCS Finance"></div>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dias=s=>Math.round((parse(s)-today())/864e5);
const uid=()=>Math.random().toString(36).slice(2,9);
const CATS=['Moradia','Mercado','Transporte','Lazer','Saúde','Contas','Educação','Outros'];
let S={tx:[],bills:[],goals:[],cfg:{payday:7}},tab='resumo',ref=null,loaded=false,note='';
const KEY='financas-v1';
let vm=iso(today()).slice(0,7),ed=null;
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF=()=>({tx:[],bills:[],goals:[],cfg:{payday:7},rec:[],recGen:{},limits:{}});
function genRec(){
  let ch=false;const t=today();S.recGen=S.recGen||{};
  [0,1].forEach(k=>{const mk=iso(new Date(t.getFullYear(),t.getMonth()+k,1)).slice(0,7);
    (S.rec||[]).forEach(r=>{const key=r.id+':'+mk;if(S.recGen[key])return;S.recGen[key]=1;ch=true;
      const due=mk+'-'+String(r.day).padStart(2,'0');
      if(due<(r.created||'0000'))return;
      S.bills.push({id:uid(),name:r.name,value:r.value,due,paid:false,rec:r.id})})});
  return ch;
}
const catSpend=v=>{const by={};v.m.filter(t=>t.type==='gasto').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.value);return by};
function limAlerts(v){
  if(vm!==iso(today()).slice(0,7))return '';
  const by=catSpend(v);let h='';
  Object.entries(S.limits||{}).forEach(([c,l])=>{if(!(l>0))return;const x=by[c]||0,p=x/l*100;
    if(p>=100)h+=`<div class="alert">🚨 ${c}: você passou do limite (${brl(x)} de ${brl(l)}).</div>`;
    else if(p>=80)h+=`<div class="alert">⚠️ ${c}: você já usou ${Math.round(p)}% do limite (${brl(x)} de ${brl(l)}).</div>`});
  return h;
}
const daysList=()=>String(S.cfg.days||'7,20').split(/[ ,;]+/).map(Number).filter(n=>n>=1&&n<=28);

function init(){loadLocal()}
function loadLocal(){
  loaded=true;note='Salvando só neste aparelho (sem sincronização).';
  try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(DEF(),JSON.parse(r))}catch(e){}
  if(genRec()){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  render();
}
function save(){
  render();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}
const monthKey=s=>s.slice(0,7);
function nextPayday(){
  const d=today();let best=null;
  daysList().forEach(p=>{let n=new Date(d.getFullYear(),d.getMonth(),p);if(n<d)n=new Date(d.getFullYear(),d.getMonth()+1,p);if(!best||n<best)best=n});
  return best||new Date(d.getFullYear(),d.getMonth()+1,7);
}
function pmt(g){
  const n=Math.max(1,Math.ceil((parse(g.date)-today())/(864e5*30.4))),r=(g.rate||0)/100,saved=g.saved||0;
  if(r>0){const f=Math.pow(1+r,n);return Math.max(0,(g.target-saved*f)*r/(f-1))}
  return Math.max(0,(g.target-saved)/n);
}
function views(){
  const mk=vm,m=S.tx.filter(t=>monthKey(t.date)===mk);
  const sum=ty=>m.filter(t=>t.type===ty).reduce((a,t)=>a+t.value,0);
  return {mk,rec:sum('receita'),gas:sum('gasto'),inv:sum('investimento'),m};
}
function resumo(){
  const v=views(),np=nextPayday(),dp=Math.round((np-today())/864e5);
  let h=`<h1>Resumo</h1><div class="card"><div class="k">Mês exibido</div><input type="month" value="${vm}" onchange="vm=this.value||vm;render()"></div>`;
  h+=`<div class="alert">${dp===0?'💰 Hoje é dia '+np.getDate()+': hora de guardar dinheiro para investir!':'📅 Próximo dia de investir ('+np.toLocaleDateString('pt-BR')+'): faltam '+dp+' dia(s).'}</div>`;
  const open=S.bills.filter(b=>!b.paid).sort((a,b)=>a.due.localeCompare(b.due));
  open.filter(b=>dias(b.due)<=3).forEach(b=>{const d=dias(b.due);h+=`<div class="alert">${d<0?'⚠️ Atrasado':'🔔'} ${b.name} (${brl(b.value)}) ${d<0?'venceu há '+(-d)+' dia(s)':d===0?'vence hoje':'vence em '+d+' dia(s)'}</div>`});
  S.goals.forEach(g=>{h+=`<div class="alert">🎯 ${g.name}: invista ${brl(pmt(g))} neste mês.</div>`});
  h+=limAlerts(v);
  h+=`<div class="card grid"><div><div class="k">Recebido</div><div class="v grn">${brl(v.rec)}</div></div><div><div class="k">Gasto</div><div class="v red">${brl(v.gas)}</div></div><div><div class="k">Investido</div><div class="v">${brl(v.inv)}</div></div></div>`;
  const by=catSpend(v),lim=S.limits||{};
  const cats=[...new Set([...Object.keys(by),...Object.keys(lim).filter(c=>lim[c]>0)])].sort((a,b)=>(by[b]||0)-(by[a]||0));
  const mx=Math.max(1,...cats.map(c=>by[c]||0));
  h+='<div class="card"><h2>Onde você mais gastou</h2>';
  h+=cats.length?cats.map(c=>{const x=by[c]||0,l=lim[c]>0?lim[c]:0,p=l?x/l*100:0,cl=!l?'':p>=100?'r':p>=80?'w':'';
    return `<div style="margin-bottom:10px"><div class="row" style="border:0;padding:0"><span>${c}</span><b>${brl(x)}${l?' <span class="mut">/ '+brl(l)+'</span>':''}</b></div><div class="bar"><i class="${cl}" style="width:${l?Math.min(100,p):x/mx*100}%"></i></div>${l?`<div class="mut">${Math.round(p)}% do limite</div>`:''}</div>`}).join(''):'<div class="mut">Sem gastos lançados neste mês.</div>';
  h+='</div>';
  h+=`<div class="card"><h2>Limites por categoria (mensal)</h2><div class="f">${CATS.map((c,i)=>`<div class="f2"><span style="align-self:center">${c}</span><input id="lm${i}" type="number" inputmode="decimal" placeholder="sem limite" value="${lim[c]||''}"></div>`).join('')}<button onclick="saveLim()">Salvar limites</button></div></div>`;
  h+=`<div class="card"><h2>Planilha e lembretes</h2><div class="f"><button onclick="exportXlsx()">Baixar planilha do mês</button><button onclick="exportIcs()">Criar lembretes no calendário</button><div class="k">Dias de lembrete para investir (separe por vírgula)</div><div class="f2"><input id="pd" value="${daysList().join(', ')}"><button onclick="S.cfg.days=pd.value;save()">Salvar</button></div></div></div>`;
  h+=`<div class="card"><h2>Backup</h2><div class="f2"><button onclick="exportar()">Exportar</button><button onclick="imp.click()">Importar</button></div><input id="imp" type="file" accept=".json" hidden onchange="importar(this.files[0])"><div class="mut" style="margin-top:6px">Use para levar seus dados entre celular e computador.</div></div>`;
  return h;
}
function lancar(){
  const e=ed?S.tx.find(t=>t.id===ed):null,sel=(v,x)=>v===x?' selected':'';
  let h=`<h1>${e?'Editar lançamento':'Lançar'}</h1><div class="card f"><select id="ty">${[['gasto','Gasto'],['investimento','Investimento'],['receita','Receita']].map(([k,n])=>`<option value="${k}"${sel(e&&e.type,k)}>${n}</option>`).join('')}</select>
  <div class="f2"><input id="vl" type="number" inputmode="decimal" step="0.01" placeholder="Valor (R$)" value="${e?e.value:''}"><input id="dt" type="date" value="${e?e.date:iso(today())}"></div>
  <select id="ct">${CATS.map(c=>`<option${sel(e&&e.cat,c)}>${c}</option>`).join('')}</select><input id="ds" placeholder="Descrição (opcional)" value="${e?E(e.desc||''):''}">
  <button onclick="addTx()">${e?'Salvar alteração':'Adicionar'}</button>${e?'<button class="s" style="width:100%" onclick="cancelEd()">Cancelar edição</button>':''}</div><div class="card"><h2>Últimos lançamentos</h2>`;
  const l=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,25);
  h+=l.length?l.map(t=>`<div class="row"><div><div>${E(t.desc||t.cat)}</div><div class="mut">${parse(t.date).toLocaleDateString('pt-BR')} · ${t.type==='gasto'?t.cat:t.type}</div></div><div style="text-align:right"><b class="${t.type==='gasto'?'red':'grn'}">${t.type==='gasto'?'−':'+'}${brl(t.value)}</b><br><button class="s" onclick="editTx('${t.id}')">✎</button> <button class="s" onclick="delTx('${t.id}')">✕</button></div></div>`).join(''):'<div class="mut">Nada lançado ainda.</div>';
  return h+'</div>';
}
function addTx(){const v=parseFloat(vl.value);if(!(v>0))return;const o={type:ty.value,value:v,date:dt.value||iso(today()),cat:ct.value,desc:ds.value.trim()};
  if(ed){const t=S.tx.find(x=>x.id===ed);if(t)Object.assign(t,o);ed=null}else S.tx.push(Object.assign({id:uid()},o));save()}
function editTx(i){ed=i;tab='lancar';render();scrollTo(0,0)}
function cancelEd(){ed=null;render()}
function saveLim(){S.limits={};CATS.forEach((c,i)=>{const v=parseFloat(document.getElementById('lm'+i).value);if(v>0)S.limits[c]=v});save()}
function delTx(i){S.tx=S.tx.filter(t=>t.id!==i);save()}
function boletos(){
  let h=`<h1>Boletos</h1><div class="card f"><input id="bn" placeholder="Nome (ex.: Internet)"><div class="f2"><input id="bv" type="number" inputmode="decimal" step="0.01" placeholder="Valor (R$)"><input id="bd" type="date"></div><button onclick="addBill()">Cadastrar boleto</button></div><div class="card">`;
  const l=[...S.bills].sort((a,b)=>(a.paid-b.paid)||a.due.localeCompare(b.due));
  h+=l.length?l.map(b=>{const d=dias(b.due);return `<div class="row"><div><div>${b.paid?'✅ ':''}${b.rec?'🔁 ':''}${E(b.name)} · <b>${brl(b.value)}</b></div><div class="mut ${!b.paid&&d<0?'red':''}">${parse(b.due).toLocaleDateString('pt-BR')}${b.paid?' · pago':d<0?' · atrasado':d===0?' · hoje':' · em '+d+' dia(s)'}</div></div><div>${b.paid?'':`<button class="s" onclick="payBill('${b.id}')">Paguei</button> `}<button class="s" onclick="delBill('${b.id}')">✕</button></div></div>`}).join(''):'<div class="mut">Nenhum boleto cadastrado.</div>';
  h+='</div>';
  h+=`<div class="card"><h2>Contas fixas (todo mês)</h2><div class="mut" style="margin-bottom:8px">O boleto é criado sozinho todo mês.</div><div class="f"><input id="rn" placeholder="Nome (ex.: Aluguel)"><div class="f2"><input id="rv" type="number" inputmode="decimal" step="0.01" placeholder="Valor (R$)"><input id="rd" type="number" min="1" max="28" placeholder="Dia do vencimento"></div><button onclick="addRec()">Cadastrar conta fixa</button></div>`;
  h+=(S.rec||[]).map(r=>`<div class="row"><div>🔁 ${E(r.name)} · <b>${brl(r.value)}</b><div class="mut">todo dia ${r.day}</div></div><button class="s" onclick="delRec('${r.id}')">✕</button></div>`).join('')+'</div>';
  return h;
}
function addRec(){const v=parseFloat(rv.value),d=Math.min(28,Math.max(1,parseInt(rd.value)));if(!rn.value.trim()||!(v>0)||!d)return;S.rec=S.rec||[];S.rec.push({id:uid(),name:rn.value.trim(),value:v,day:d,created:iso(today())});genRec();save()}
function delRec(i){S.rec=S.rec.filter(r=>r.id!==i);S.bills=S.bills.filter(b=>!(b.rec===i&&!b.paid));save()}
function addBill(){const v=parseFloat(bv.value);if(!bn.value.trim()||!(v>0)||!bd.value)return;S.bills.push({id:uid(),name:bn.value.trim(),value:v,due:bd.value,paid:false});save()}
function payBill(i){const b=S.bills.find(x=>x.id===i);b.paid=true;S.tx.push({id:uid(),type:'gasto',value:b.value,date:iso(today()),cat:'Contas',desc:b.name});save()}
function delBill(i){S.bills=S.bills.filter(b=>b.id!==i);save()}
function metas(){
  let h=`<h1>Metas</h1><div class="card f"><input id="gn" placeholder="Meta (ex.: Viagem)"><div class="f2"><input id="gt" type="number" inputmode="decimal" placeholder="Valor alvo (R$)"><input id="gd" type="date"></div><div class="f2"><input id="gs" type="number" inputmode="decimal" placeholder="Já tenho (R$)"><input id="gr" type="number" step="0.01" placeholder="Rendimento % ao mês"></div><button onclick="addGoal()">Criar meta</button></div>`;
  h+=S.goals.map(g=>`<div class="card"><div class="row" style="border:0;padding:0"><h2>${g.name}</h2><button class="s" onclick="delGoal('${g.id}')">✕</button></div><div class="mut">${brl(g.target)} até ${parse(g.date).toLocaleDateString('pt-BR')}</div><div style="margin-top:6px">Invista por mês: <b>${brl(pmt(g))}</b></div></div>`).join('');
  return h;
}
function addGoal(){const t=parseFloat(gt.value);if(!gn.value.trim()||!(t>0)||!gd.value)return;S.goals.push({id:uid(),name:gn.value.trim(),target:t,date:gd.value,saved:parseFloat(gs.value)||0,rate:parseFloat(gr.value)||0});save()}
function delGoal(i){S.goals=S.goals.filter(g=>g.id!==i);save()}
function render(){
  const a=document.getElementById('app');
  const act=document.activeElement&&document.activeElement.id;
  if(!loaded){a.innerHTML='<div class="mut" style="padding:30px;text-align:center">Carregando…</div>'}
  else a.innerHTML=({resumo,lancar,boletos,metas})[tab]()+(note?`<div class="mut">${note}</div>`:'');
  document.getElementById('nav').innerHTML=[['resumo','📊','Resumo'],['lancar','➕','Lançar'],['boletos','🧾','Boletos'],['metas','🎯','Metas']].map(([k,i,n])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)">${i}<br>${n}</button>`).join('');
}
function exportar(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='financas-'+iso(today())+'.json';a.click()}
function importar(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm('Isso substitui os dados deste aparelho. Continuar?'))return;S=Object.assign(DEF(),d);genRec();save()}catch(e){alert('Arquivo inválido.')}};r.readAsText(f)}
function exportXlsx(){
  if(typeof XLSX==='undefined'){alert('A biblioteca da planilha não carregou. Abra o app com internet e tente de novo.');return}
  const v=views(),mk=vm,money='R$ #,##0.00';
  const by={};v.m.filter(t=>t.type==='gasto').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.value);
  const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=ent.length?ent[0][1]:1;
  const A=[['Resumo de '+mk],[],['Recebido',v.rec],['Gasto',v.gas],['Investido',v.inv],['Sobra (recebido - gasto - investido)',v.rec-v.gas-v.inv],['% da receita investida',v.rec?v.inv/v.rec:0],[],['Categoria','Gasto','% do gasto','Gráfico']];
  ent.forEach(([c,x])=>A.push([c,x,v.gas?x/v.gas:0,'█'.repeat(Math.max(1,Math.round(x/mx*20)))]));
  const w1=XLSX.utils.aoa_to_sheet(A);
  ['B3','B4','B5','B6'].forEach(a=>w1[a].z=money);w1.B7.z='0.0%';
  ent.forEach((_,i)=>{w1['B'+(10+i)].z=money;w1['C'+(10+i)].z='0.0%'});
  w1['!cols']=[{wch:38},{wch:16},{wch:12},{wch:24}];
  const L=[['Data','Tipo','Categoria','Descrição','Valor']];
  [...v.m].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>L.push([parse(t.date).toLocaleDateString('pt-BR'),t.type,t.type==='gasto'?t.cat:'',t.desc||'',t.value]));
  const w2=XLSX.utils.aoa_to_sheet(L);for(let i=2;i<=L.length;i++)w2['E'+i].z=money;
  w2['!cols']=[{wch:12},{wch:14},{wch:14},{wch:28},{wch:14}];
  const B=[['Boleto','Vencimento','Valor','Situação']];
  S.bills.filter(b=>monthKey(b.due)===mk).sort((a,b)=>a.due.localeCompare(b.due)).forEach(b=>B.push([b.name,parse(b.due).toLocaleDateString('pt-BR'),b.value,b.paid?'Pago':'Em aberto']));
  const w3=XLSX.utils.aoa_to_sheet(B);for(let i=2;i<=B.length;i++)w3['C'+i].z=money;w3['!cols']=[{wch:24},{wch:12},{wch:14},{wch:12}];
  const H={};S.tx.forEach(t=>{const k=monthKey(t.date);H[k]=H[k]||{r:0,g:0,i:0};H[k][t.type==='receita'?'r':t.type==='gasto'?'g':'i']+=t.value});
  const R=[['Mês','Recebido','Gasto','Investido']];Object.keys(H).sort().forEach(k=>R.push([k,H[k].r,H[k].g,H[k].i]));
  const w4=XLSX.utils.aoa_to_sheet(R);for(let i=2;i<=R.length;i++)['B','C','D'].forEach(c=>w4[c+i].z=money);w4['!cols']=[{wch:10},{wch:14},{wch:14},{wch:14}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,w1,'Resumo');XLSX.utils.book_append_sheet(wb,w2,'Lançamentos');XLSX.utils.book_append_sheet(wb,w3,'Boletos');XLSX.utils.book_append_sheet(wb,w4,'Histórico');
  XLSX.writeFile(wb,'financas-'+mk+'.xlsx');
}
function exportIcs(){
  const pad=n=>String(n).padStart(2,'0'),st=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()),esc=t=>String(t).replace(/([,;\\])/g,'\\$1');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Financas//PT'];
  const ev=(uid,title,d,rr,alarms)=>{L.push('BEGIN:VEVENT','UID:'+uid+'@financas','DTSTAMP:'+st(new Date())+'T000000Z','DTSTART:'+st(d)+'T090000','DTEND:'+st(d)+'T093000','SUMMARY:'+esc(title));if(rr)L.push(rr);alarms.forEach(a=>L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc(title),'TRIGGER:'+a,'END:VALARM'));L.push('END:VEVENT')};
  const t0=today();
  daysList().forEach(p=>{let n=new Date(t0.getFullYear(),t0.getMonth(),p);if(n<t0)n=new Date(t0.getFullYear(),t0.getMonth()+1,p);ev('invest-'+p,'Guardar dinheiro para investir',n,'RRULE:FREQ=MONTHLY;BYMONTHDAY='+p,['PT0M'])});
  S.bills.filter(b=>!b.paid&&dias(b.due)>=0).forEach(b=>ev('boleto-'+b.id,'Pagar boleto: '+b.name+' ('+brl(b.value)+')',parse(b.due),null,['-P1D','PT0M']));
  L.push('END:VCALENDAR');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar'}));a.download='lembretes-financas.ics';a.click();
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
