<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCS Finance</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c0d12">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RCS Finance">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7480;--bd:#e3e6ea;--pri:#0f766e;--red:#c2410c;--grn:#15803d;--warn:#fef3c7;--warnt:#78350f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111418;--card:#1b2026;--tx:#e8ebee;--mut:#98a2ae;--bd:#2c333b;--pri:#2dd4bf;--red:#fb923c;--grn:#4ade80;--warn:#3b2f0a;--warnt:#fde68a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111418;--card:#1b2026;--tx:#e8ebee;--mut:#98a2ae;--bd:#2c333b;--pri:#2dd4bf;--red:#fb923c;--grn:#4ade80;--warn:#3b2f0a;--warnt:#fde68a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.alert{background:var(--warn);color:var(--warnt);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{font-size:12px;color:var(--mut)}.v{font-weight:700;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--pri)}
input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
button{background:var(--pri);color:#fff;border:0;font-weight:600;cursor:pointer}
button.s{width:auto;padding:6px 10px;font-size:13px;background:transparent;color:var(--mut);border:1px solid var(--bd)}
.f{display:grid;gap:8px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;color:var(--mut);border-radius:0;padding:12px 4px;font-size:13px}
nav button.on{color:var(--pri)}
.bar i.w{background:#d97706}.bar i.r{background:var(--red)}
.red{color:var(--red)}.grn{color:var(--grn)}.mut{color:var(--mut);font-size:13px}
.brand{background:#0c0d12;border-radius:12px;margin:14px 14px 0;display:flex;flex-direction:column;align-items:center;padding:6px}.brand img{display:block;width:100%;max-width:300px;height:auto}
@media(min-width:680px){.brand{max-width:612px;margin:14px auto 0}}
.tools{align-self:flex-end;display:flex;gap:6px;position:relative;padding:2px 2px 4px}.tools>button{width:32px;height:32px;padding:0;font-size:16px;border-radius:50%;background:rgba(255,255,255,.14);border:0;color:#fff}
.menu{position:absolute;top:38px;right:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px;display:grid;gap:4px;min-width:170px;z-index:5}.menu[hidden]{display:none}.menu button{width:auto;background:transparent;color:var(--tx);font-size:14px;padding:8px 10px;text-align:left;font-weight:500}
.sec{padding:12px 0 4px;margin-top:10px;border-top:1px solid var(--bd)}
details.card>summary{list-style:none}details.card>summary::-webkit-details-marker{display:none}details.card>summary::after{content:'▾';float:right;color:var(--mut)}details.card[open]>summary::after{content:'▴'}
.brand .bt{display:none;color:#fff;font-weight:700;letter-spacing:.4px;font-size:15px}
.brand.mini{flex-direction:row;justify-content:space-between;align-items:center;padding:4px 10px}.brand.mini img{display:none}.brand.mini .bt{display:block}.brand.mini .tools{align-self:auto;padding:0}
.tools>button{position:relative}.dot{position:absolute;top:1px;right:1px;width:9px;height:9px;border-radius:50%;background:#ef4444;display:none}
.mrow{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}.mrow b{text-transform:capitalize}.mrow button{width:40px;height:34px;padding:0;font-size:18px}
.card>.sec{border-top:0;margin-top:0;padding:0}
details.card>summary{font-weight:600;cursor:pointer}
.fab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:10}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}
.sheetbox{background:var(--card);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:#1f2937;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;max-width:88%;z-index:30;box-shadow:0 4px 12px rgba(0,0,0,.3)}.toast[hidden]{display:none}
</style>
</head>
<body>
<div class="brand" id="brand">
<span class="bt">RCS Finance</span>
<div class="tools" id="tools" style="display:none"><button title="Baixar planilha do mês" aria-label="Baixar planilha do mês" onclick="exportXlsx()">📊</button><button title="Backup" aria-label="Backup" onclick="toggleBk()">💾</button><button title="Configurações" aria-label="Configurações" onclick="openCfg()">⚙️<i class="dot" id="dot"></i></button><div class="menu" id="bkmenu" hidden><button onclick="exportar();toggleBk()">Exportar backup</button><button onclick="imp.click();toggleBk()">Importar backup</button></div></div>
<img src="logo.png" alt="RCS Finance">
<input id="imp" type="file" accept=".json" hidden onchange="importar(this.files[0]);this.value=''">
</div>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast" class="toast" hidden></div>
<button id="fab" class="fab" aria-label="Novo lançamento" onclick="openSheet()" style="display:none">＋</button>
<div id="sheet" class="sheet" hidden onclick="if(event.target===this)closeSheet()"><div class="sheetbox" id="sheetbody"></div></div>
<script>
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dias=s=>Math.round((parse(s)-today())/864e5);
const uid=()=>Math.random().toString(36).slice(2,9);
const CATS=['Moradia','Mercado','Transporte','Lazer','Saúde','Contas','Educação','Outros'];
let S={tx:[],bills:[],goals:[],cfg:{payday:7}},tab='resumo',ref=null,loaded=false,note='';
let KEY='financas-v1';
let vm=iso(today()).slice(0,7),ed=null,PR=[],cur=null,gate=null,hiddenAt=0;
function savePR(){try{localStorage.setItem('rcs-profiles',JSON.stringify(PR))}catch(e){}}
let sessChk=false,sb=null,user=null,syncMsg='',syncing=false,again=false,pt=null;
try{const c=window.RCS_CFG||{};if(c.url&&c.key&&window.supabase)sb=window.supabase.createClient(c.url,c.key)}catch(e){}
const recoveryHash=/type=recovery/.test(location.hash);
if(sb)sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){gate={m:'reset'};loaded=true;render()}});
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const busy=()=>{const t=document.activeElement&&document.activeElement.tagName;return t==='INPUT'||t==='SELECT'};
const softRender=()=>{if(!gate&&!busy())render()};
async function ensureUser(){if(!sb)return null;try{const {data}=await sb.auth.getSession();user=data.session?data.session.user:null}catch(e){}return user}
async function getRemote(){const {data,error}=await sb.from('finance_data').select('data').eq('user_id',user.id).maybeSingle();if(error)throw error;return data&&data.data&&data.data.ts?data.data:null}
async function push(){const {error}=await sb.from('finance_data').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});if(error)throw error}
async function syncNow(manual){
  if(!sb||!cur||!cur.acct)return;
  if(syncing){again=true;return}
  syncing=true;
  try{
    await ensureUser();sessChk=true;
    if(!user||(cur.email&&user.email!==cur.email)){syncMsg='Entre na conta para sincronizar.';return}
    const r=await getRemote(),t=S.ts||0;
    if(!r||t>r.ts)await push();
    else if(t<r.ts){S=Object.assign(DEF(),r);persist()}
    syncMsg='Sincronizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){syncMsg='Sem conexão ou erro ao sincronizar. Seus dados continuam salvos neste aparelho.'}
  finally{syncing=false;if(again){again=false;syncNow()}else softRender()}
}
function schedPush(){if(!sb||!cur||!cur.acct)return;clearTimeout(pt);pt=setTimeout(()=>{pt=null;syncNow()},800)}
async function doAuth(kind){
  const em=(document.getElementById('em').value||'').trim(),pw=document.getElementById('pw').value||'';
  if(!sb)return null;
  if(!em||pw.length<6){alert('Informe e-mail e senha (mínimo 6 caracteres).');return null}
  try{
    const r=kind==='up'?await sb.auth.signUp({email:em,password:pw}):await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){alert(r.error.message);return null}
    if(!r.data.session){alert('Conta criada. Confirme o e-mail que enviamos e depois toque em Entrar.');return null}
    user=r.data.session.user;return user;
  }catch(e){alert('Não foi possível conectar. Verifique a internet.');return null}
}
async function accIn(kind){
  if(!await doAuth(kind))return;
  try{
    const r=await getRemote(),has=S.tx.length||S.bills.length||S.goals.length||(S.rec||[]).length;
    cur.acct=true;cur.email=user.email;savePR();
    if(r&&has){if(confirm('Esta conta já tem dados na nuvem.\n\nOK = usar os dados da nuvem (substitui os deste perfil)\nCancelar = enviar os dados deste perfil (substitui os da nuvem)')){S=Object.assign(DEF(),r)}else S.ts=Date.now()}
    else if(r)S=Object.assign(DEF(),r);
    else S.ts=Date.now();
    persist();syncMsg='';await syncNow(true);
  }catch(e){syncMsg='Erro ao vincular a conta.'}
  render();
}
async function openAcctProfile(){
  let p=PR.find(x=>x.email===user.email);
  if(!p){const r=await getRemote(),id='p'+uid();p={id,name:user.email.split('@')[0],key:'rcs-'+id,acct:true,email:user.email};PR.push(p);savePR();if(r)try{localStorage.setItem(p.key,JSON.stringify(r))}catch(e){}}
  openProfile(p);
}
async function gateIn(kind){
  if(!await doAuth(kind))return;
  try{await openAcctProfile()}catch(e){alert('Não foi possível carregar os dados da conta.')}
}
async function forgotPw(){
  const em=(document.getElementById('em').value||'').trim();
  if(!sb)return;
  if(!em){alert('Digite seu e-mail no campo acima e toque de novo em "Esqueci a senha".');return}
  try{
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
    alert(error?'Não foi possível enviar o e-mail: '+error.message:'Se esse e-mail tiver conta, enviamos um link para criar uma nova senha. Confira a caixa de entrada e o spam.');
  }catch(e){alert('Sem conexão. Tente de novo.')}
}
async function resetPw(){
  const a=document.getElementById('np').value||'',b=document.getElementById('np2').value||'';
  if(a.length<6){alert('A senha precisa ter pelo menos 6 caracteres.');return}
  if(a!==b){alert('As senhas não são iguais.');return}
  try{
    const ss=await sb.auth.getSession();
    if(!ss.data.session){alert('O link expirou. Volte e toque em "Esqueci a senha" para receber outro.');return}
    const {error}=await sb.auth.updateUser({password:a});
    if(error){alert(error.message);return}
    user=ss.data.session.user;
    try{history.replaceState(null,'',location.pathname)}catch(e){}
    alert('Senha alterada!');
    await openAcctProfile();
  }catch(e){alert('Não foi possível salvar a nova senha. Tente de novo.')}
}
async function accOut(){try{await sb.auth.signOut()}catch(e){}user=null;cur.acct=false;cur.email=null;savePR();syncMsg='';render()}
let pushSt='?';
const b64u=x=>{const p='='.repeat((4-x.length%4)%4),r=atob((x+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
const pushOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const vapid=()=>(window.RCS_CFG||{}).vapid||'';
async function pushState(){
  if(!pushOK())return 'unsupported';
  if(Notification.permission==='denied')return 'denied';
  try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();return sub&&Notification.permission==='granted'?'on':'off'}catch(e){return 'off'}
}
async function getSub(){const reg=await navigator.serviceWorker.ready;return {reg,sub:await reg.pushManager.getSubscription()}}
async function pushOn(){
  if(!sb||!vapid()){alert('Notificações ainda não configuradas neste site.');return}
  if(!(cur&&cur.acct&&syncOk())){alert('Entre na conta em "Sincronização" primeiro: é por ela que os avisos chegam.');return}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){pushSt=perm==='denied'?'denied':'off';render();alert('Permissão não concedida. Se bloqueou sem querer, libere nos Ajustes do celular.');return}
    const {reg,sub:old}=await getSub();
    const sub=old||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(vapid())});
    const j=sub.toJSON();
    const {error}=await sb.from('push_subs').upsert({user_id:user.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:'endpoint'});
    if(error)throw error;
    pushSt='on';render();toast('Notificações ativadas neste aparelho.');
  }catch(e){alert('Não foi possível ativar: '+((e&&e.message)||e))}
}
async function pushOff(){
  try{const {sub}=await getSub();if(sub){try{await sb.from('push_subs').delete().eq('endpoint',sub.endpoint)}catch(e){}await sub.unsubscribe()}}catch(e){}
  pushSt='off';render();
}
async function pushTest(){
  try{
    const {sub}=await getSub();if(!sub){alert('Ative as notificações primeiro.');return}
    const j=sub.toJSON();
    const {data,error}=await sb.functions.invoke('rcs-push',{body:{items:[{sub:{endpoint:j.endpoint,keys:j.keys},title:'RCS Finance',body:'✅ Teste: as notificações estão funcionando!'}]}});
    if(error)throw error;
    if(data&&data.ok>0)toast('Teste enviado. A notificação deve chegar em instantes.');else alert('O servidor não conseguiu entregar o teste. Tente desativar e ativar de novo.');
  }catch(e){alert('Falha no teste: '+((e&&e.message)||e))}
}
async function localNotify(t,b,tag){try{if(!pushOK()||Notification.permission!=='granted')return;const reg=await navigator.serviceWorker.ready;await reg.showNotification(t,{body:b,icon:'icon-192.png',badge:'icon-192.png',tag})}catch(e){}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},5000)}
function limitCheck(o){
  if(o.type!=='gasto')return;const l=(S.limits||{})[o.cat];if(!(l>0))return;
  const mk=monthKey(o.date),spent=S.tx.filter(t=>t.type==='gasto'&&t.cat===o.cat&&monthKey(t.date)===mk).reduce((a,t)=>a+t.value,0),p=spent/l*100,lv=p>=100?100:p>=80?80:0;
  if(!lv)return;
  S.limN=S.limN||{};const k=mk+':'+o.cat;if((S.limN[k]||0)>=lv)return;S.limN[k]=lv;
  const m=lv===100?`🚨 ${o.cat}: você passou do limite (${brl(spent)} de ${brl(l)})`:`⚠️ ${o.cat}: você já usou ${Math.round(p)}% do limite (${brl(spent)} de ${brl(l)})`;
  toast(m);localNotify('RCS Finance',m,'lim-'+o.cat);
}
function pushCard(){
  pushState().then(x=>{if(x!==pushSt){pushSt=x;if(tab==='config'&&!gate)softRender()}});
  let b;
  if(!sb||!vapid())b='<div class="mut">Ainda não configuradas neste site.</div>';
  else if(pushSt==='unsupported')b='<div class="mut">Este navegador não permite avisos. No iPhone, abra o app pelo <b>ícone da tela inicial</b> (instalado pelo Safari) e use o iOS 16.4 ou mais novo.</div>';
  else if(pushSt==='denied')b='<div class="mut">As notificações estão bloqueadas para este app. Libere em Ajustes do celular e volte aqui.</div>';
  else if(pushSt==='on')b='<div class="mut" style="margin-bottom:8px">✅ Ativadas neste aparelho. Você recebe os avisos de metas e boletos todo dia às 8h, e o aviso de limite na hora em que lança o gasto.</div><div class="f2"><button onclick="pushTest()">Enviar teste</button><button class="s" style="width:100%" onclick="pushOff()">Desativar</button></div>';
  else b='<div class="mut" style="margin-bottom:8px">Receba avisos de metas, boletos e limites direto neste celular.</div><button onclick="pushOn()">Ativar notificações</button>';
  return `<div class="sec"><h2>Notificações</h2>${b}</div>`;
}
const getCats=()=>(S.cats&&S.cats.length?S.cats:CATS);
let catOpen=true;
function collectLim(){const L={};getCats().forEach((c,i)=>{const el=document.getElementById('lm'+i),v=el?parseFloat(el.value):(S.limits||{})[c];if(v>0)L[c]=v});S.limits=L}
function saveLim(){collectLim();save()}
function addCat(){const n=(document.getElementById('nc').value||'').trim();if(!n)return;if(getCats().some(c=>c.toLowerCase()===n.toLowerCase())){alert('Essa categoria já existe.');return}collectLim();S.cats=[...getCats(),n];save()}
function delCat(i){const c=getCats()[i];if(getCats().length<=1){alert('Mantenha pelo menos uma categoria.');return}if(!confirm('Remover a categoria "'+c+'"? Lançamentos antigos continuam com ela.'))return;collectLim();delete S.limits[c];S.cats=getCats().filter((_,j)=>j!==i);save()}
function catCard(){
  const lim=S.limits||{};
  return `<details class="card" ${catOpen?'open':''} ontoggle="catOpen=this.open"><summary style="cursor:pointer;font-weight:600">Categorias e limites</summary><div class="mut" style="margin:8px 0">Defina um limite mensal (opcional) e adicione ou remova categorias.</div><div class="f">${getCats().map((c,i)=>`<div style="display:grid;grid-template-columns:1fr 110px auto;gap:6px;align-items:center"><span>${E(c)}</span><input id="lm${i}" type="number" inputmode="decimal" placeholder="sem limite" value="${lim[c]||''}"><button class="s" onclick="delCat(${i})">✕</button></div>`).join('')}<button onclick="saveLim()">Salvar limites</button><div class="f2"><input id="nc" placeholder="Nova categoria"><button class="s" style="width:100%" onclick="addCat()">Adicionar</button></div></div></details>`;
}
const syncOk=()=>!!(user&&cur&&user.email===cur.email);
const needLogin=()=>!!(sb&&cur&&cur.acct&&sessChk&&!syncOk());
function openCfg(){tab='config';render();scrollTo(0,0)}
function configTab(){
  const perfil=`<div class="sec"><h2>Perfil: ${E(cur?cur.name:'')}</h2><div class="f"><button class="s" style="width:100%" onclick="lock()">Trocar de perfil</button><button class="s" style="width:100%" onclick="delProfile()">Apagar este perfil</button></div></div>`;
  return `<h1>Configurações</h1>${catCard()}<div class="card">${pushCard()}</div><div class="card">${syncCard()}</div><div class="card">${perfil}</div>`;
}
function syncCard(){
  if(!sb)return `<div class="sec"><h2>Sincronização</h2><div class="mut">Ainda não configurada neste site.</div></div>`;
  if(cur&&cur.acct){const ok=user&&user.email===cur.email;
    return `<div class="sec"><h2>Sincronização</h2><div class="mut">Conta: ${E(cur.email)}</div><div class="mut">${E(syncMsg)}</div>${ok?`<div class="f2" style="margin-top:8px"><button onclick="syncNow(true)">Sincronizar agora</button><button class="s" style="width:100%" onclick="accOut()">Sair da conta</button></div>`:`<div class="f" style="margin-top:8px"><input id="em" type="email" value="${E(cur.email)}"><input id="pw" type="password" placeholder="Senha"><button onclick="accIn('in')">Entrar</button><button class="s" style="width:100%" onclick="forgotPw()">Esqueci a senha</button></div>`}</div>`}

  <div class="row" style="border:0;padding:0"><b>${brl(b)}</b><span class="mut">de ${brl(g.target)} · ${Math.round(pct)}%</span></div><div class="bar"><i style="width:${pct}%"></i></div>
  <div style="margin-top:8px">${l1}</div>${l2?`<div class="mut">${l2}</div>`:''}<div class="mut">${g.days&&g.days.length?'🔔 Lembrete nos dias '+g.days.join(' e '):'🔕 Sem lembrete (ajuste em "Ajustar meta")'}</div>
  ${det('d','＋ Guardei',`<div class="f" style="margin-top:8px"><div class="f2"><input id="dv_${id}" type="number" inputmode="decimal" step="0.01" placeholder="Valor (R$)" value="${g.plan>0?g.plan:''}"><input id="dd_${id}" type="date" value="${iso(today())}"></div><button onclick="addDep('${id}')">Registrar</button></div>`)}
  ${det('h',`Histórico (${dep.length})`,dep.length?dep.map(d=>`<div class="row"><div>${parse(d.date).toLocaleDateString('pt-BR')}</div><div><b class="grn">+${brl(d.value)}</b> <button class="s" onclick="delDep('${id}','${d.id}')">✕</button></div></div>`).join(''):'<div class="mut" style="margin-top:6px">Nenhum aporte ainda.</div>')}
  ${det('a','Ajustar meta',`<div class="f" style="margin-top:8px"><div class="f2"><input id="ga_${id}" type="number" inputmode="decimal" placeholder="Valor alvo" value="${val(g.target)}"><input id="gb_${id}" type="date" value="${g.date||''}"></div><div class="f2"><input id="gc_${id}" type="number" inputmode="decimal" placeholder="Guardar por mês" value="${g.plan>0?g.plan:''}"><input id="gy_${id}" type="number" step="0.01" placeholder="Rendimento % ao ano" value="${g.rateA>0?g.rateA:''}"></div><div class="k">Lembrete: dias do mês (até 2)</div><div class="f2"><input id="gv1_${id}" type="number" min="1" max="28" placeholder="Dia 1" value="${(g.days||[])[0]||''}"><input id="gv2_${id}" type="number" min="1" max="28" placeholder="Dia 2" value="${(g.days||[])[1]||''}"></div><button onclick="saveGoal('${id}')">Salvar</button></div>`)}</div>`;
}
function metas(){
  let h=`<h1>Metas</h1><details id="gf" class="card" ${gfOpen?'open':''} ontoggle="gfOpen=this.open"><summary>＋ Nova meta</summary><div class="f" style="margin-top:10px"><input id="gn" placeholder="Nome (ex.: Viagem Chile, Carro)"><div class="f2"><input id="gt" type="number" inputmode="decimal" placeholder="Valor alvo (R$)"><input id="gp" type="number" inputmode="decimal" placeholder="Guardar por mês (R$)"></div><div class="f2"><input id="gs" type="number" inputmode="decimal" placeholder="Já tenho (R$)"><input id="gr" type="number" step="0.01" placeholder="Rendimento % ao ano"></div><div class="k">Data limite (opcional)</div><input id="gd" type="date"><div class="k">Lembrete: dias do mês para investir (até 2)</div><div class="f2"><input id="gv1" type="number" min="1" max="28" placeholder="Dia 1 (ex.: 7)"><input id="gv2" type="number" min="1" max="28" placeholder="Dia 2 (ex.: 20)"></div><div class="mut">Rendimento: informe a taxa anual (ex.: o CDI atual). Deixe vazio se não quiser contar rendimento.</div><button onclick="addGoal()">Criar meta</button></div></details>`;
  h+=S.goals.length?S.goals.map(goalCard).join(''):'<div class="mut">Nenhuma meta ainda. Crie a primeira acima.</div>';
  return h;
}
function addGoal(){const t=parseFloat(gt.value);if(!gn.value.trim()||!(t>0))return;
  S.goals.push({id:uid(),name:gn.value.trim(),target:t,date:gd.value||'',plan:parseFloat(gp.value)||0,saved:parseFloat(gs.value)||0,rateA:parseFloat(gr.value)||0,days:readDays(gv1.value,gv2.value),deps:[]});gfOpen=false;save()}
function addDep(id){const g=S.goals.find(x=>x.id===id),v=parseFloat(document.getElementById('dv_'+id).value),d=document.getElementById('dd_'+id).value||iso(today());
  if(!g||!(v>0))return;const did=uid(),tid=uid();
  g.deps=g.deps||[];g.deps.push({id:did,date:d,value:v,tx:tid});
  S.tx.push({id:tid,type:'investimento',value:v,date:d,cat:'Metas',desc:'Meta: '+g.name});
  gOpen['d'+id]=false;save()}
function delDep(gid,did){const g=S.goals.find(x=>x.id===gid);if(!g)return;const d=(g.deps||[]).find(x=>x.id===did);
  g.deps=(g.deps||[]).filter(x=>x.id!==did);if(d&&d.tx)S.tx=S.tx.filter(t=>t.id!==d.tx);save()}
function saveGoal(id){const g=S.goals.find(x=>x.id===id),gv=k=>document.getElementById(k+'_'+id).value,t=parseFloat(gv('ga'));if(!g||!(t>0))return;
  g.target=t;g.date=gv('gb')||'';g.plan=parseFloat(gv('gc'))||0;g.rateA=parseFloat(gv('gy'))||0;g.days=readDays(gv('gv1'),gv('gv2'));gOpen['a'+id]=false;save()}
function delGoal(i){S.goals=S.goals.filter(g=>g.id!==i);save()}
function render(){
  const g=id=>document.getElementById(id),tl=g('tools'),br=g('brand'),fb=g('fab'),dotEl=g('dot');
  if(tl&&tl.style)tl.style.display=gate?'none':'flex';
  if(fb&&fb.style)fb.style.display=(gate||!loaded)?'none':'block';
  if(br&&br.classList)br.classList.toggle('mini',!gate&&tab!=='resumo');
  if(dotEl&&dotEl.style)dotEl.style.display=needLogin()?'block':'none';
  if(gate){g('app').innerHTML=gateHtml();g('nav').innerHTML='';return}
  const a=g('app');
  if(!loaded){a.innerHTML='<div class="mut" style="padding:30px;text-align:center">Carregando…</div>'}
  else a.innerHTML=({resumo,lancar,boletos,metas,graficos,config:configTab})[tab]()+(note?`<div class="mut">${note}</div>`:'');
  g('nav').innerHTML=[['resumo','🏠','Resumo'],['lancar','📋','Extrato'],['boletos','🧾','Boletos'],['metas','🎯','Metas'],['graficos','📈','Gráficos']].map(([k,i,n])=>`<button class="${tab===k?'on':''}" onclick="go2('${k}')">${i}<br>${n}</button>`).join('');
}
function toggleBk(){const m=document.getElementById('bkmenu');m.hidden=!m.hidden}
document.addEventListener('click',e=>{const m=document.getElementById('bkmenu');if(m&&!m.hidden&&e.target.closest&&!e.target.closest('#tools'))m.hidden=true});
function exportar(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='financas-'+iso(today())+'.json';a.click()}
function importar(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm('Isso substitui os dados deste aparelho. Continuar?'))return;S=Object.assign(DEF(),d);genRec();save()}catch(e){alert('Arquivo inválido.')}};r.readAsText(f)}
function exportXlsx(){
  if(typeof XLSX==='undefined'){alert('A biblioteca da planilha não carregou. Abra o app com internet e tente de novo.');return}
  const v=views(),mk=vm,money='R$ #,##0.00';
  const by={};v.m.filter(t=>t.type==='gasto').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.value);
  const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=ent.length?ent[0][1]:1;
  const A=[['Resumo de '+mk],[],['Recebido',v.rec],['Gasto',v.gas],['Investido',v.inv],['Sobra (recebido - gasto - investido)',v.rec-v.gas-v.inv],['% da receita investida',v.rec?v.inv/v.rec:0],[],['Categoria','Gasto','% do gasto','Gráfico']];
  ent.forEach(([c,x])=>A.push([c,x,v.gas?x/v.gas:0,'█'.repeat(Math.max(1,Math.round(x/mx*20)))]));
  const w1=XLSX.utils.aoa_to_sheet(A);
  ['B3','B4','B5','B6'].forEach(a=>w1[a].z=money);w1.B7.z='0.0%';
  ent.forEach((_,i)=>{w1['B'+(10+i)].z=money;w1['C'+(10+i)].z='0.0%'});
  w1['!cols']=[{wch:38},{wch:16},{wch:12},{wch:24}];
  const L=[['Data','Tipo','Categoria','Descrição','Valor']];
  [...v.m].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>L.push([parse(t.date).toLocaleDateString('pt-BR'),t.type,t.type==='gasto'?t.cat:'',t.desc||'',t.value]));
  const w2=XLSX.utils.aoa_to_sheet(L);for(let i=2;i<=L.length;i++)w2['E'+i].z=money;
  w2['!cols']=[{wch:12},{wch:14},{wch:14},{wch:28},{wch:14}];
  const B=[['Boleto','Vencimento','Valor','Situação']];
  S.bills.filter(b=>monthKey(b.due)===mk).sort((a,b)=>a.due.localeCompare(b.due)).forEach(b=>B.push([b.name,parse(b.due).toLocaleDateString('pt-BR'),b.value,b.paid?'Pago':'Em aberto']));
  const w3=XLSX.utils.aoa_to_sheet(B);for(let i=2;i<=B.length;i++)w3['C'+i].z=money;w3['!cols']=[{wch:24},{wch:12},{wch:14},{wch:12}];
  const H={};S.tx.forEach(t=>{const k=monthKey(t.date);H[k]=H[k]||{r:0,g:0,i:0};H[k][t.type==='receita'?'r':t.type==='gasto'?'g':'i']+=t.value});
  const R=[['Mês','Recebido','Gasto','Investido']];Object.keys(H).sort().forEach(k=>R.push([k,H[k].r,H[k].g,H[k].i]));
  const w4=XLSX.utils.aoa_to_sheet(R);for(let i=2;i<=R.length;i++)['B','C','D'].forEach(c=>w4[c+i].z=money);w4['!cols']=[{wch:10},{wch:14},{wch:14},{wch:14}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,w1,'Resumo');XLSX.utils.book_append_sheet(wb,w2,'Lançamentos');XLSX.utils.book_append_sheet(wb,w3,'Boletos');XLSX.utils.book_append_sheet(wb,w4,'Histórico');
  XLSX.writeFile(wb,'financas-'+mk+'.xlsx');
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script>
